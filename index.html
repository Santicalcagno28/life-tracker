<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0a0a0a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Tracker" />
  <title>Life Tracker</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0f0f0f;
      --bg2: #1a1a1a;
      --bg3: #222222;
      --border: rgba(255,255,255,0.08);
      --border2: rgba(255,255,255,0.14);
      --text: #f0f0f0;
      --text2: #888;
      --text3: #555;
      --accent: #5DCAA5;
      --accent-bg: rgba(93,202,165,0.12);
      --accent-dark: #1D9E75;
      --blue: #378ADD;
      --blue-bg: rgba(55,138,221,0.12);
      --amber: #EF9F27;
      --amber-bg: rgba(239,159,39,0.12);
      --red: #E24B4A;
      --radius: 12px;
      --radius-sm: 8px;
      --font: 'DM Sans', sans-serif;
      --font-mono: 'DM Mono', monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; background: var(--bg); color: var(--text); font-family: var(--font); overflow: hidden; }
    .app { display: flex; flex-direction: column; height: 100dvh; max-width: 480px; margin: 0 auto; }
    .header { padding: 52px 20px 16px; flex-shrink: 0; }
    .header-top { display: flex; align-items: flex-end; justify-content: space-between; }
    .header-date { font-size: 12px; color: var(--text3); font-family: var(--font-mono); letter-spacing: 0.05em; margin-bottom: 4px; }
    .header-title { font-size: 26px; font-weight: 600; }
    .header-streak { display: flex; align-items: center; gap: 6px; background: var(--amber-bg); border: 0.5px solid rgba(239,159,39,0.25); padding: 6px 12px; border-radius: 20px; }
    .header-streak span { font-size: 13px; font-weight: 500; color: var(--amber); }
    .ring-wrap { display: flex; align-items: center; gap: 16px; padding: 16px 20px; background: var(--bg2); border-bottom: 0.5px solid var(--border); flex-shrink: 0; }
    .ring-text-val { font-size: 22px; font-weight: 600; }
    .ring-text-label { font-size: 12px; color: var(--text2); margin-top: 2px; }
    .ring-habits-mini { display: flex; flex-wrap: wrap; gap: 6px; flex: 1; }
    .habit-mini-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--bg3); border: 0.5px solid var(--border); transition: background 0.3s; }
    .habit-mini-dot.done { background: var(--accent); border-color: var(--accent); }
    .tabs { display: flex; border-bottom: 0.5px solid var(--border); flex-shrink: 0; }
    .tab-btn { flex: 1; background: none; border: none; padding: 11px 4px; font-size: 12px; font-weight: 500; color: var(--text3); cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 5px; border-bottom: 2px solid transparent; margin-bottom: -1px; transition: all 0.15s; font-family: var(--font); }
    .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }
    .tab-btn i { font-size: 15px; }
    .content { flex: 1; overflow-y: auto; padding: 16px 20px 100px; }
    .content::-webkit-scrollbar { width: 0; }
    .day-strip { display: flex; gap: 6px; margin-bottom: 16px; overflow-x: auto; padding-bottom: 4px; }
    .day-strip::-webkit-scrollbar { height: 0; }
    .day-pill { display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 40px; padding: 8px 6px; border-radius: var(--radius-sm); background: var(--bg2); border: 0.5px solid var(--border); }
    .day-pill.today { border-color: var(--accent); background: var(--accent-bg); }
    .day-pill-label { font-size: 10px; color: var(--text3); font-weight: 500; }
    .day-pill.today .day-pill-label { color: var(--accent); }
    .day-pill-num { font-size: 13px; font-weight: 600; color: var(--text2); }
    .day-pill.today .day-pill-num { color: var(--accent); }
    .habit-card { display: flex; align-items: center; gap: 12px; background: var(--bg2); border: 0.5px solid var(--border); border-radius: var(--radius); padding: 14px; margin-bottom: 8px; cursor: pointer; transition: all 0.2s; user-select: none; }
    .habit-card:active { transform: scale(0.98); }
    .habit-card.done { border-color: rgba(93,202,165,0.25); background: rgba(93,202,165,0.06); }
    .habit-check { width: 24px; height: 24px; border-radius: 50%; border: 1.5px solid var(--border2); display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: all 0.25s; }
    .habit-card.done .habit-check { background: var(--accent); border-color: var(--accent); }
    .habit-card.done .habit-check i { color: #0f0f0f; font-size: 13px; }
    .habit-icon-wrap { width: 36px; height: 36px; border-radius: var(--radius-sm); background: var(--bg3); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .habit-icon-wrap i { font-size: 18px; color: var(--text2); }
    .habit-card.done .habit-icon-wrap { background: var(--accent-bg); }
    .habit-card.done .habit-icon-wrap i { color: var(--accent); }
    .habit-name { font-size: 14px; font-weight: 500; color: var(--text); }
    .habit-card.done .habit-name { color: var(--text2); }
    .section-label { font-size: 11px; font-weight: 500; letter-spacing: 0.08em; color: var(--text3); text-transform: uppercase; margin: 20px 0 10px; }
    .add-row { display: flex; gap: 8px; margin-bottom: 16px; }
    .add-input { flex: 1; background: var(--bg2); border: 0.5px solid var(--border); border-radius: var(--radius-sm); padding: 10px 14px; font-size: 14px; color: var(--text); font-family: var(--font); outline: none; transition: border-color 0.15s; }
    .add-input::placeholder { color: var(--text3); }
    .add-input:focus { border-color: var(--border2); }
    .add-btn { background: var(--accent-bg); border: 0.5px solid rgba(93,202,165,0.3); color: var(--accent); border-radius: var(--radius-sm); padding: 0 16px; font-size: 14px; font-weight: 500; cursor: pointer; font-family: var(--font); white-space: nowrap; }
    .todo-item { display: flex; align-items: center; gap: 10px; background: var(--bg2); border: 0.5px solid var(--border); border-radius: var(--radius-sm); padding: 12px 14px; margin-bottom: 6px; }
    .todo-check { width: 20px; height: 20px; border-radius: 5px; border: 1.5px solid var(--border2); cursor: pointer; flex-shrink: 0; display: flex; align-items: center; justify-content: center; transition: all 0.2s; }
    .todo-item.done .todo-check { background: var(--accent-dark); border-color: var(--accent-dark); }
    .todo-item.done .todo-check i { color: white; font-size: 12px; }
    .todo-text { flex: 1; font-size: 14px; color: var(--text); }
    .todo-item.done .todo-text { text-decoration: line-through; color: var(--text3); }
    .todo-del { background: none; border: none; cursor: pointer; color: var(--text3); padding: 4px; display: flex; align-items: center; }
    .todo-del i { font-size: 15px; }
    .goals-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }
    .goal-card { background: var(--bg2); border: 0.5px solid var(--border); border-radius: var(--radius); padding: 16px 14px; }
    .goal-card.done-card { opacity: 0.5; }
    .goal-icon { font-size: 22px; margin-bottom: 10px; color: var(--text2); }
    .goal-card.active-card .goal-icon { color: var(--blue); }
    .goal-card.done-card .goal-icon { color: var(--accent); }
    .goal-name { font-size: 13px; font-weight: 500; color: var(--text); margin-bottom: 8px; line-height: 1.35; }
    .goal-badge { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 500; padding: 3px 8px; border-radius: 20px; }
    .badge-pending { background: var(--amber-bg); color: var(--amber); }
    .badge-active { background: var(--blue-bg); color: var(--blue); }
    .badge-done { background: var(--accent-bg); color: var(--accent); }
    /* MONTH */
    .month-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
    .month-title { font-size: 18px; font-weight: 600; }
    .month-nav { display: flex; gap: 4px; }
    .month-nav button { background: var(--bg2); border: 0.5px solid var(--border); color: var(--text2); width: 32px; height: 32px; border-radius: var(--radius-sm); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 16px; }
    .month-nav button:disabled { opacity: 0.3; cursor: default; }
    .month-stats { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 20px; }
    .stat-card { background: var(--bg2); border: 0.5px solid var(--border); border-radius: var(--radius-sm); padding: 12px; text-align: center; }
    .stat-val { font-size: 22px; font-weight: 600; }
    .stat-label { font-size: 11px; color: var(--text3); margin-top: 3px; }
    .chart-wrap { background: var(--bg2); border: 0.5px solid var(--border); border-radius: var(--radius); padding: 16px; margin-bottom: 20px; }
    .chart-label { font-size: 12px; color: var(--text3); margin-bottom: 14px; font-family: var(--font-mono); }
    .bars { display: flex; align-items: flex-end; gap: 2px; height: 100px; }
    .bar-col { display: flex; flex-direction: column; align-items: center; gap: 4px; flex: 1; min-width: 0; }
    .bar { width: 100%; border-radius: 2px 2px 0 0; min-height: 2px; }
    .bar.c-today { background: var(--accent); }
    .bar.c-good  { background: #1D9E75; }
    .bar.c-mid   { background: #185FA5; }
    .bar.c-low   { background: var(--bg3); }
    .bar-day { font-size: 9px; color: var(--text3); font-family: var(--font-mono); }
    .top-habits { background: var(--bg2); border: 0.5px solid var(--border); border-radius: var(--radius); padding: 16px; margin-bottom: 20px; }
    .top-label { font-size: 12px; color: var(--text3); margin-bottom: 12px; font-family: var(--font-mono); }
    .hrow { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
    .hrow-name { font-size: 13px; color: var(--text); width: 130px; flex-shrink: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .hrow-bar-bg { flex: 1; height: 6px; background: var(--bg3); border-radius: 3px; overflow: hidden; }
    .hrow-bar { height: 100%; border-radius: 3px; background: var(--accent); transition: width 0.5s; }
    .hrow-pct { font-size: 12px; color: var(--text2); font-family: var(--font-mono); width: 36px; text-align: right; }
    .hist-card { background: var(--bg2); border: 0.5px solid var(--border); border-radius: var(--radius); padding: 16px; margin-bottom: 10px; }
    .hist-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    .hist-month { font-size: 15px; font-weight: 600; }
    .hist-badge { font-size: 12px; font-weight: 500; padding: 3px 10px; border-radius: 20px; background: var(--accent-bg); color: var(--accent); }
    .hist-bars { display: flex; align-items: flex-end; gap: 2px; height: 40px; }
    .hist-bar { flex: 1; border-radius: 2px 2px 0 0; min-height: 2px; }
    .empty { text-align: center; padding: 40px 20px; color: var(--text3); font-size: 14px; }
    .empty i { font-size: 32px; display: block; margin-bottom: 10px; }
    .install-banner { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--bg2); border: 0.5px solid var(--border2); border-radius: var(--radius); padding: 12px 16px; display: flex; align-items: center; gap: 12px; max-width: 440px; width: calc(100% - 40px); z-index: 100; animation: slideUp 0.3s ease; }
    @keyframes slideUp { from { opacity:0; transform: translateX(-50%) translateY(20px); } to { opacity:1; transform: translateX(-50%) translateY(0); } }
    .install-banner-text { flex: 1; font-size: 13px; color: var(--text2); }
    .install-banner-text strong { color: var(--text); display: block; font-size: 14px; margin-bottom: 2px; }
    .install-btn { background: var(--accent); color: #0f0f0f; border: none; padding: 8px 14px; border-radius: var(--radius-sm); font-size: 13px; font-weight: 600; cursor: pointer; font-family: var(--font); }
    .close-banner { background: none; border: none; color: var(--text3); cursor: pointer; padding: 4px; }
    @media (min-width: 600px) {
      .app { border-left: 0.5px solid var(--border); border-right: 0.5px solid var(--border); }
      .header { padding-top: 32px; }
    }
  </style>
</head>
<body>
<div class="app">
  <div class="header">
    <div class="header-date" id="headerDate"></div>
    <div class="header-top">
      <div class="header-title">Tracker</div>
      <div class="header-streak">
        <i class="ti ti-flame" style="font-size:16px;color:var(--amber)"></i>
        <span id="streakCount">0 días</span>
      </div>
    </div>
  </div>
  <div class="ring-wrap">
    <svg width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="Progreso diario" style="flex-shrink:0">
      <circle cx="32" cy="32" r="26" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="6"/>
      <circle id="ringCircle" cx="32" cy="32" r="26" fill="none" stroke="#5DCAA5" stroke-width="6"
        stroke-linecap="round" stroke-dasharray="163.4" stroke-dashoffset="163.4"
        transform="rotate(-90 32 32)" style="transition:stroke-dashoffset 0.5s ease"/>
      <text x="32" y="37" text-anchor="middle" font-size="14" font-weight="600" fill="#f0f0f0" font-family="DM Sans,sans-serif" id="ringPct">0%</text>
    </svg>
    <div>
      <div class="ring-text-val" id="ringVal">0 / 11</div>
      <div class="ring-text-label">hábitos completados hoy</div>
    </div>
    <div class="ring-habits-mini" id="miniDots"></div>
  </div>
  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('habits')" id="tab-habits"><i class="ti ti-sun"></i> Hábitos</button>
    <button class="tab-btn" onclick="switchTab('todos')" id="tab-todos"><i class="ti ti-list-check"></i> Tareas</button>
    <button class="tab-btn" onclick="switchTab('goals')" id="tab-goals"><i class="ti ti-target"></i> Metas</button>
    <button class="tab-btn" onclick="switchTab('month')" id="tab-month"><i class="ti ti-chart-bar"></i> Mes</button>
  </div>
  <div class="content" id="content"></div>
</div>

<script>
const HABITS = [
  {id:'fe',          name:'Fe',               icon:'ti-pray'},
  {id:'agua',        name:'Hidratación',      icon:'ti-droplet'},
  {id:'sueno',       name:'Sueño',            icon:'ti-moon'},
  {id:'lectura',     name:'Lectura',          icon:'ti-book'},
  {id:'comida',      name:'Alimentación',     icon:'ti-salad'},
  {id:'suplementos', name:'Suplementos',      icon:'ti-pill'},
  {id:'postura',     name:'Postura & Stretch',icon:'ti-yoga'},
  {id:'estudio',     name:'Estudio',          icon:'ti-school'},
  {id:'ejercicio',   name:'Ejercicio',        icon:'ti-run'},
  {id:'facial',      name:'Cuidado facial',   icon:'ti-sparkles'},
  {id:'mente',       name:'Mente',            icon:'ti-brain'},
];
const GOALS = {
  pending:[
    {name:'Licencia de conducir',icon:'ti-steering-wheel'},
    {name:'Robótica',icon:'ti-robot'},
    {name:'Plan financiero',icon:'ti-coins'},
    {name:'Surf',icon:'ti-wave-saw-tool'},
  ],
  active:[
    {name:'Corrección postural',icon:'ti-spine'},
    {name:'Físico',icon:'ti-barbell'},
    {name:'12 libros',icon:'ti-books'},
    {name:'Beca MEXT',icon:'ti-plane-departure'},
    {name:'Estilo personal',icon:'ti-hanger'},
    {name:'Bienestar mental',icon:'ti-heart'},
  ],
  done:[{name:'Análisis de gastos',icon:'ti-chart-pie'}]
};
const MONTHS=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const DAYS=['D','L','M','X','J','V','S'];
const now=new Date();
const todayKey=now.toDateString();

let state=JSON.parse(localStorage.getItem('lt_state')||'{}');
if(!state.done)state.done={};
if(!state.todos)state.todos=[];
if(!state.streak)state.streak={count:0,lastFull:null};
if(!state.history)state.history={};

let currentTab='habits';
let chartMonth=now.getMonth();
let chartYear=now.getFullYear();

function save(){localStorage.setItem('lt_state',JSON.stringify(state));}
function todayDone(){return state.done[todayKey]||{};}
function getDoneCount(){return Object.values(todayDone()).filter(Boolean).length;}

function checkMonthEnd(){
  const d=new Date();
  const last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();
  if(d.getDate()===last){
    const k=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
    if(!state.history[k])saveMonthSummary(d.getFullYear(),d.getMonth(),k);
  }
}

function saveMonthSummary(year,month,key){
  const days=new Date(year,month+1,0).getDate();
  const counts=[];
  const hc={};
  HABITS.forEach(h=>hc[h.id]=0);
  let total=0;
  for(let d=1;d<=days;d++){
    const dk=new Date(year,month,d).toDateString();
    const dd=state.done[dk]||{};
    const c=Object.values(dd).filter(Boolean).length;
    counts.push(c); total+=c;
    HABITS.forEach(h=>{if(dd[h.id])hc[h.id]++;});
  }
  const dwd=counts.filter(c=>c>0).length;
  const avg=dwd?Math.round(total/(dwd*HABITS.length)*100):0;
  const perf=counts.filter(c=>c===HABITS.length).length;
  state.history[key]={dailyCounts:counts,avgPct:avg,perfectDays:perf,daysInMonth:days};
  save();
}

function updateRing(){
  const count=getDoneCount(),total=HABITS.length;
  const pct=Math.round(count/total*100);
  const circ=163.4;
  document.getElementById('ringCircle').style.strokeDashoffset=circ-(circ*pct/100);
  document.getElementById('ringPct').textContent=pct+'%';
  document.getElementById('ringVal').textContent=count+' / '+total;
  document.getElementById('miniDots').innerHTML=HABITS.map(h=>`<div class="habit-mini-dot${todayDone()[h.id]?' done':''}"></div>`).join('');
  if(count===total&&state.streak.lastFull!==todayKey){state.streak.count++;state.streak.lastFull=todayKey;save();}
  document.getElementById('streakCount').textContent=state.streak.count+' días';
}

function buildHeader(){
  const ds=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
  const ms=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
  const n=new Date();
  document.getElementById('headerDate').textContent=ds[n.getDay()]+', '+n.getDate()+' '+ms[n.getMonth()]+' '+n.getFullYear();
}

function renderHabits(){
  const n=new Date(),strip=[];
  for(let i=-3;i<=3;i++){
    const d=new Date(n);d.setDate(n.getDate()+i);
    strip.push(`<div class="day-pill${i===0?' today':''}"><div class="day-pill-label">${DAYS[d.getDay()]}</div><div class="day-pill-num">${d.getDate()}</div></div>`);
  }
  const d=todayDone();
  return `<div class="day-strip">${strip.join('')}</div>`+
    HABITS.map(h=>`<div class="habit-card${d[h.id]?' done':''}" onclick="toggleHabit('${h.id}')">
      <div class="habit-check">${d[h.id]?'<i class="ti ti-check"></i>':''}</div>
      <div class="habit-icon-wrap"><i class="ti ${h.icon}"></i></div>
      <div class="habit-name">${h.name}</div>
    </div>`).join('');
}

function toggleHabit(id){
  if(!state.done[todayKey])state.done[todayKey]={};
  state.done[todayKey][id]=!state.done[todayKey][id];
  save();render();updateRing();
}

function renderTodos(){
  const add=`<div class="add-row"><input class="add-input" id="todoInput" placeholder="Nueva tarea..." onkeydown="if(event.key==='Enter')addTodo()"/><button class="add-btn" onclick="addTodo()"><i class="ti ti-plus"></i> Agregar</button></div>`;
  if(!state.todos.length)return add+`<div class="empty"><i class="ti ti-circle-check"></i>Sin pendientes</div>`;
  const rl=arr=>arr.map(t=>{
    const ri=state.todos.indexOf(t);
    return `<div class="todo-item${t.done?' done':''}">
      <div class="todo-check" onclick="toggleTodo(${ri})">${t.done?'<i class="ti ti-check"></i>':''}</div>
      <span class="todo-text">${t.text}</span>
      <button class="todo-del" onclick="deleteTodo(${ri})"><i class="ti ti-x"></i></button>
    </div>`;
  }).join('');
  const p=state.todos.filter(t=>!t.done),d=state.todos.filter(t=>t.done);
  return add+rl(p)+(d.length?`<div class="section-label">Completadas</div>${rl(d)}`:'');
}

function addTodo(){const i=document.getElementById('todoInput');const v=i?i.value.trim():'';if(!v)return;state.todos.push({text:v,done:false});save();render();}
function toggleTodo(i){state.todos[i].done=!state.todos[i].done;save();render();}
function deleteTodo(i){state.todos.splice(i,1);save();render();}

function renderGoals(){
  const S=[
    {key:'pending',label:'Por empezar',icon:'ti-hourglass',badge:'badge-pending',bi:'ti-clock'},
    {key:'active',label:'En camino',icon:'ti-trending-up',badge:'badge-active',bi:'ti-trending-up'},
    {key:'done',label:'Completadas',icon:'ti-circle-check',badge:'badge-done',bi:'ti-check'},
  ];
  return S.map(s=>`<div class="section-label"><i class="ti ${s.icon}" style="font-size:13px;vertical-align:-1px;margin-right:4px"></i>${s.label}</div>
    <div class="goals-grid">${GOALS[s.key].map(g=>`<div class="goal-card ${s.key}-card">
      <div class="goal-icon"><i class="ti ${g.icon}"></i></div>
      <div class="goal-name">${g.name}</div>
      <span class="goal-badge ${s.badge}"><i class="ti ${s.bi}" style="font-size:11px"></i> ${s.label}</span>
    </div>`).join('')}</div>`).join('');
}

function getMonthData(year,month){
  const days=new Date(year,month+1,0).getDate();
  const counts=[];
  const hc={};
  HABITS.forEach(h=>hc[h.id]=0);
  let total=0;
  for(let d=1;d<=days;d++){
    const date=new Date(year,month,d);
    const dd=state.done[date.toDateString()]||{};
    const c=Object.values(dd).filter(Boolean).length;
    counts.push({day:d,count:c,isToday:date.toDateString()===todayKey});
    total+=c;
    HABITS.forEach(h=>{if(dd[h.id])hc[h.id]++;});
  }
  const dwd=counts.filter(d=>d.count>0).length;
  const avg=dwd?Math.round(total/(dwd*HABITS.length)*100):0;
  const perf=counts.filter(d=>d.count===HABITS.length).length;
  const best=Math.max(...counts.map(d=>d.count),0);
  return {counts,hc,avg,perf,best,days};
}

function renderMonth(){
  const isCur=chartMonth===now.getMonth()&&chartYear===now.getFullYear();
  const {counts,hc,avg,perf,best,days}=getMonthData(chartYear,chartMonth);
  const total=HABITS.length;
  const pm=chartMonth===0?11:chartMonth-1,py=chartMonth===0?chartYear-1:chartYear;
  const nm=chartMonth===11?0:chartMonth+1,ny=chartMonth===11?chartYear+1:chartYear;

  const header=`<div class="month-header">
    <div class="month-title">${MONTHS[chartMonth]} ${chartYear}</div>
    <div class="month-nav">
      <button onclick="navMonth(${py},${pm})"><i class="ti ti-chevron-left"></i></button>
      ${!isCur?`<button onclick="navMonth(${now.getFullYear()},${now.getMonth()})"><i class="ti ti-calendar-event"></i></button>`:''}
      <button onclick="navMonth(${ny},${nm})"${isCur?' disabled':''}><i class="ti ti-chevron-right"></i></button>
    </div>
  </div>`;

  const stats=`<div class="month-stats">
    <div class="stat-card"><div class="stat-val">${avg}%</div><div class="stat-label">promedio</div></div>
    <div class="stat-card"><div class="stat-val">${perf}</div><div class="stat-label">días perfectos</div></div>
    <div class="stat-card"><div class="stat-val">${best}/${total}</div><div class="stat-label">mejor día</div></div>
  </div>`;

  const maxH=Math.max(best,1);
  const bars=counts.map(d=>{
    const h=Math.round(d.count/maxH*100);
    const cls=d.isToday?'c-today':d.count===total?'c-good':d.count>=Math.ceil(total/2)?'c-mid':'c-low';
    return `<div class="bar-col">
      <div class="bar ${cls}" style="height:${h}px" title="${d.day}: ${d.count}/${total}"></div>
      ${d.day%5===1||d.day===days?`<div class="bar-day">${d.day}</div>`:'<div class="bar-day"> </div>'}
    </div>`;
  }).join('');

  const chart=`<div class="chart-wrap">
    <div class="chart-label">hábitos por día</div>
    <div class="bars">${bars}</div>
  </div>`;

  const sorted=HABITS.map(h=>({...h,c:hc[h.id]})).sort((a,b)=>b.c-a.c);
  const topRows=sorted.map(h=>{
    const pct=Math.round(h.c/days*100);
    return `<div class="hrow">
      <div class="hrow-name">${h.name}</div>
      <div class="hrow-bar-bg"><div class="hrow-bar" style="width:${pct}%"></div></div>
      <div class="hrow-pct">${pct}%</div>
    </div>`;
  }).join('');
  const top=`<div class="top-habits"><div class="top-label">consistencia por hábito</div>${topRows}</div>`;

  const hkeys=Object.keys(state.history).sort().reverse();
  let hist='';
  if(hkeys.length){
    const cards=hkeys.map(k=>{
      const h=state.history[k];
      const [y,m]=k.split('-');
      const mx=Math.max(...h.dailyCounts,1);
      const mb=h.dailyCounts.map(c=>{
        const hh=Math.round(c/mx*40);
        const col=c===HABITS.length?'#1D9E75':c>=Math.ceil(HABITS.length/2)?'#185FA5':'#222';
        return `<div class="hist-bar" style="height:${Math.max(hh,2)}px;background:${col}"></div>`;
      }).join('');
      return `<div class="hist-card">
        <div class="hist-header">
          <div class="hist-month">${MONTHS[parseInt(m)-1]} ${y}</div>
          <div class="hist-badge">${h.avgPct}% promedio</div>
        </div>
        <div class="hist-bars">${mb}</div>
      </div>`;
    }).join('');
    hist=`<div class="section-label"><i class="ti ti-history" style="font-size:13px;vertical-align:-1px;margin-right:4px"></i>Historial guardado</div>${cards}`;
  }

  return header+stats+chart+top+hist;
}

function navMonth(y,m){chartYear=y;chartMonth=m;render();}

function render(){
  const c=document.getElementById('content');
  if(currentTab==='habits')c.innerHTML=renderHabits();
  else if(currentTab==='todos')c.innerHTML=renderTodos();
  else if(currentTab==='goals')c.innerHTML=renderGoals();
  else c.innerHTML=renderMonth();
}

function switchTab(tab){
  currentTab=tab;
  ['habits','todos','goals','month'].forEach(t=>document.getElementById('tab-'+t).classList.toggle('active',t===tab));
  render();
}

let deferredPrompt=null;
window.addEventListener('beforeinstallprompt',e=>{
  e.preventDefault();deferredPrompt=e;
  if(!localStorage.getItem('lt_installed'))showInstallBanner();
});
function showInstallBanner(){
  const b=document.createElement('div');b.className='install-banner';
  b.innerHTML=`<div class="install-banner-text"><strong>Instalar app</strong>Accedé sin internet, desde tu pantalla de inicio</div>
    <button class="install-btn" onclick="installPWA()">Instalar</button>
    <button class="close-banner" onclick="this.parentElement.remove()"><i class="ti ti-x" style="font-size:16px"></i></button>`;
  document.body.appendChild(b);
}
function installPWA(){
  if(!deferredPrompt)return;
  deferredPrompt.prompt();
  deferredPrompt.userChoice.then(r=>{
    if(r.outcome==='accepted')localStorage.setItem('lt_installed','1');
    document.querySelector('.install-banner')?.remove();deferredPrompt=null;
  });
}
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
checkMonthEnd();buildHeader();updateRing();render();
</script>
